[project]
name = "log-agent"
version = "0.1.0"
description = "基于 deepagents 的 CLI 日志分析智能体，结合日志与源码定位问题根因"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2.0",
    "langchain-openai>=0.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "prompt-toolkit>=3.0.43",
]

[project.scripts]
log-agent = "log_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_agent"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
# B008：typer 的参数声明本来就是在默认值里调用 typer.Option(...)
# E501：中文提示文案按语义断行，不强求行宽
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
