[project]
name = "log-agent"
version = "0.1.0"
description = "基于 deepagents 的 CLI 日志分析智能体，结合日志与源码定位问题根因"
readme = "README.md"
requires-python = ">=3.11"
# 带上限的几项是有意为之：agent.py / render.py / netguard.py 依赖它们的内部细节（内置工具名、
# 系统提示词不被追加、stream_events v3、回调继承、SDK 重试日志），升级前先跑 tests/test_upstream_contracts.py 再放宽上限。
# openai 暂不放到 3.x：3.x 换成了 httpx2，netguard 的重试监听和相关测试需要单独适配。
dependencies = [
    "deepagents>=0.7.18,<0.8",
    "langchain>=1.4.2,<2",
    "langchain-core>=1.6.4,<2",
    "langgraph>=1.2.12,<2",
    "langchain-openai>=1.6.4,<2",
    "openai>=2.0,<3",
    "httpx>=0.27,<1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4",
    "prompt-toolkit>=3.0.43",
]

[project.scripts]
log-agent = "log_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_agent"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
# B008：typer 的参数声明本来就是在默认值里调用 typer.Option(...)
# E501：中文提示文案按语义断行，不强求行宽
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
