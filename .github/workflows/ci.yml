name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一跑一次"上游最新版"检查，依赖在允许范围内发新版时提前发现补丁失效
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      # 故意不设 PYTHONUTF8：要验证在 Windows 默认的 GBK/cp1252 环境下也不会乱码或崩溃
      - name: Test
        run: uv run pytest

      # 完整 analyze 流程（脚本化模型，无需 API key）也包含在 pytest 的 tests/test_smoke.py 里；
      # 这里再在 CI 的真实控制台下直接跑一遍，输出留在日志里方便肉眼检查乱码
      - name: CLI smoke
        shell: bash
        run: |
          uv run log-agent --help
          uv run log-agent config
          printf '2026-06-09 14:00:01 WARN twilio failed trace=T42\n2026-06-09 14:00:02 INFO fallback trace=T42\n' > "$RUNNER_TEMP/smoke.log"
          OPENAI_API_KEY=smoke uv run python -m tests.smoke_driver "$RUNNER_TEMP/smoke.log" src "$RUNNER_TEMP/report.json"

  upstream-latest:
    # 用允许范围内的最新依赖跑契约测试：lock 文件保证用户装到的是测过的版本，
    # 这个 job 负责提前告诉我们"下次放开 / 升级时哪些补丁会失效"
    name: upstream latest / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install newest allowed versions
        run: uv sync --upgrade
      - name: Upstream contracts + smoke
        run: uv run pytest tests/test_upstream_contracts.py tests/test_smoke.py -v

  sqlite-compatibility:
    name: SQLite 3.37 / session history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install using system Python
        run: uv sync --locked --python "$(command -v python)"
      - name: Build SQLite 3.37 with JSON1
        shell: bash
        run: |
          curl --fail --location https://www.sqlite.org/2021/sqlite-amalgamation-3370000.zip -o "$RUNNER_TEMP/sqlite.zip"
          echo "a443aaf5cf345613492efa679ef1c9cc31ba109dcdf37ee377f61ab500d042fe  $RUNNER_TEMP/sqlite.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/sqlite.zip" -d "$RUNNER_TEMP/sqlite-compat"
          cc -shared -fPIC -O2 -DSQLITE_ENABLE_JSON1 "$RUNNER_TEMP/sqlite-compat/sqlite-amalgamation-3370000/sqlite3.c" -o "$RUNNER_TEMP/sqlite-compat/libsqlite3.so.0" -lm -ldl -lpthread
      - name: Verify runtime and test search against old SQLite
        env:
          LOG_AGENT_TEST_SQLITE_VERSION: "3.37.0"
        run: LD_LIBRARY_PATH="$RUNNER_TEMP/sqlite-compat" .venv/bin/python -m pytest tests/test_history.py
